# One Gateway per revision, so a route can be moved between owners at runtime.
# Distinct ports: klipper cannot assign two LoadBalancers the same node IP:port,
# and a Programmed=False/AddressNotAssigned would otherwise muddy every reading.
apiVersion: v1
kind: Namespace
metadata:
  name: gwtest
  labels:
    istio.io/rev: ingressgw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: gwtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: gwtest
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gtw-old
  namespace: gwtest
  labels:
    istio.io/rev: __REV_OLD__
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.local"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gtw-new
  namespace: gwtest
  labels:
    istio.io/rev: __REV_NEW__
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      hostname: "*.lab.local"
      allowedRoutes:
        namespaces:
          from: Same
