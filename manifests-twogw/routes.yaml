# Each route starts ATTACHED TO THE GATEWAY OF ITS OWN REVISION — the aligned
# state. Tests then move a route's parentRef to the other revision's Gateway,
# so ownership of the route and ownership of its parent disagree at runtime
# rather than at creation.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: r-old
  namespace: gwtest
  labels:
    istio.io/rev: __REV_OLD__
spec:
  parentRefs:
    - name: gtw-old
  hostnames:
    - r-old.lab.local
  rules:
    - backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: r-new
  namespace: gwtest
  labels:
    istio.io/rev: __REV_NEW__
spec:
  parentRefs:
    - name: gtw-new
  hostnames:
    - r-new.lab.local
  rules:
    - backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: r-none
  namespace: gwtest
spec:
  parentRefs:
    - name: gtw-old
  hostnames:
    - rnone.lab.local
  rules:
    - backendRefs:
        - name: whoami
          port: 80
