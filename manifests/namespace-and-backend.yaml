# Namespace carries a revision TAG (not a literal revision) so that an
# unlabelled route in it exercises the tag-inheritance path.
apiVersion: v1
kind: Namespace
metadata:
  name: gwtest
  labels:
    istio.io/rev: ingressgw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: gwtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: gwtest
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
